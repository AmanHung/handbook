name: Validate passport integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  passport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:passport
      - run: npm run test:passport:integration
      - run: npm run build
